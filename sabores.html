<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores Disponíveis — REI DO POD CAF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body class="relative">

  <!-- ── Header ─────────────────────────────────────────── -->
  <a href="index.html"
     class="inline-flex items-center gap-2 m-6 text-blue-400 hover:text-blue-300 transition-colors text-sm font-medium">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
    </svg>
    Voltar
  </a>

  <header class="text-center px-4 mb-10 relative z-10">
    <p class="text-xs font-bold tracking-[.25em] uppercase text-blue-400 mb-3">Catálogo Atualizado</p>
    <h1 class="text-4xl md:text-5xl font-black tracking-tight mb-3"
        style="font-family:'Barlow Condensed',sans-serif;">
      ESCOLHA SEU <span style="color:var(--accent)">SABOR</span>
    </h1>
    <p class="text-slate-400 text-sm max-w-md mx-auto">
      Clique no sabor e seu pedido vai direto pro WhatsApp 💬
    </p>
  </header>

  <!-- ── Busca ───────────────────────────────────────────── -->
  <div class="relative z-10 px-4 max-w-7xl mx-auto">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
      </svg>
      <label for="busca-sabor" class="sr-only">Buscar produto ou sabor</label>
      <input id="busca-sabor" type="search" placeholder="Buscar produto ou sabor…" autocomplete="off">
    </div>
  </div>

  <!-- ── Grid de produtos ────────────────────────────────── -->
  <!-- Os cards são renderizados dinamicamente por script.js a partir de PRODUTOS -->
  <main id="grid" class="relative z-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 px-4 max-w-7xl mx-auto pb-20"></main>

  <footer class="text-center text-slate-600 text-xs pb-8">
    &copy; 2026 REI DO POD CAF — Todos os direitos reservados.
  </footer>

  <script src="script.js"></script>
</body>

</html>
